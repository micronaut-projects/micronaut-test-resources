plugins {
    id "io.micronaut.build.internal.parent"
}

pluginManager.apply(io.micronaut.build.catalogs.MicronautVersionCatalogUpdatePlugin)

tasks.withType(io.micronaut.build.catalogs.tasks.VersionCatalogUpdate).configureEach {
    outputDirectory = file("gradle")
    failWhenNoVersionFound = false
}

tasks.named("publishGuide") {
    def writeDefaultTestResourceImages = project(":micronaut-test-resources-core").tasks.named("writeDefaultTestResourceImages")
    dependsOn(writeDefaultTestResourceImages)
    propertiesFiles.from(writeDefaultTestResourceImages.flatMap { it.propertiesFile })
    properties['micronautVersion'] = micronautVersion
}

def kafkaTestsEnabled = providers.gradleProperty("kafka").isPresent()
project(":micronaut-test-resources-kafka") {
    // Kafka starts several heavyweight Testcontainers and is opt-in for the
    // aggregate build. The dedicated Kafka CI workflow enables it with -Pkafka.
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        enabled = kafkaTestsEnabled
    }
}

repositories {
    mavenCentral()
//    maven {
//        url "https://s01.oss.sonatype.org/content/repositories/snapshots"
//    }
}
