plugins {
    id 'io.micronaut.build.internal.test-resources-base'
}

// Shared setup of the test-suite-docs-* projects backing the snippet:: macros of the user guide.
// These suites exercise the Micronaut Test extensions in-process (no test resources service is
// started): the JUnit Platform listeners of the extensions run against the fake client of each suite.

configurations.all {
    resolutionStrategy.preferProjectModules()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
