plugins {
    id 'io.micronaut.build.internal.test-resources-module'
}

description = """
Provides support for resolving test resources from Docker Compose services.
"""

dependencies {
    api(project(':micronaut-test-resources-core'))
    implementation(project(':micronaut-test-resources-testcontainers'))
    implementation(mn.snakeyaml)

    testImplementation(project(':micronaut-test-resources-jdbc-postgresql'))
    testImplementation(project(':micronaut-test-resources-redis'))
    testImplementation(project(':micronaut-test-resources-rabbitmq'))
    testImplementation(project(':micronaut-test-resources-kafka'))
    testImplementation(project(':micronaut-test-resources-mongodb'))
    testImplementation(project(':micronaut-test-resources-localstack-core'))
}

micronautBuild {
    // new module, so disable binary check for now
    binaryCompatibility {
        enabled = false
    }
}
