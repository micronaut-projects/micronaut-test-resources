import io.micronaut.internal.WriteDefaultTestResourceImages

plugins {
    id 'io.micronaut.build.internal.test-resources-module'
}

description = """
Core support for test resources loading.
This module defines interfaces of test resources resolvers, as well as facilities for loading them lazily.
"""

def writeDefaultTestResourceImages = tasks.register("writeDefaultTestResourceImages", WriteDefaultTestResourceImages) {
    manifestFile.set(layout.projectDirectory.file("src/main/resources/io/micronaut/testresources/core/default-images/Dockerfile"))
    outputDirectory.set(layout.buildDirectory.dir("generated/sources/default-images/java"))
    propertiesFile.set(layout.buildDirectory.file("generated/default-images/default-test-resource-images.properties"))
    getPackage().set("io.micronaut.testresources.core")
}

sourceSets.main.java.srcDir(writeDefaultTestResourceImages.flatMap { it.outputDirectory })

dependencies {
    api(mn.micronaut.json.core)

    compileOnly(mnSerde.micronaut.serde.jackson)
}
