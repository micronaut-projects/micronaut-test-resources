plugins {
    id 'io.micronaut.build.internal.test-resources-module'
}

description = """
Provides support for launching an Infinispan test container.
"""

dependencies {
    api(projects.micronautTestResourcesCore)
    api(projects.micronautTestResourcesTestcontainers)
    api(mnCache.versions.infinispan.map {"org.infinispan:infinispan-server-testdriver-core:$it" })

    testImplementation(projects.micronautTestResourcesEmbedded)
    testImplementation(testFixtures(projects.micronautTestResourcesTestcontainers))
    testImplementation(mnCache.micronaut.cache.infinispan)

    constraints {
        implementation("org.apache.logging.log4j:log4j-core:2.26.1") {
            because "https://ossindex.sonatype.org/vulnerability/CVE-2025-68161?component-type=maven&component-name=org.apache.logging.log4j%2Flog4j-core&utm_source=ossindex-client&utm_medium=integration&utm_content=1.8.2"
        }
        implementation("io.vertx:vertx-core:4.5.32") {
            because "https://ossindex.sonatype.org/vulnerability/CVE-2026-1002?component-type=maven&component-name=io.vertx%2Fvertx-core&utm_source=ossindex-client&utm_medium=integration&utm_content=1.8.2"
        }
        implementation("com.fasterxml.jackson.core:jackson-core:2.22.2") {
            because "fixes Jackson security vulnerabilities in Infinispan transitive dependencies"
        }
        implementation("com.fasterxml.jackson.core:jackson-databind:2.22.2") {
            because "fixes Jackson security vulnerabilities in Infinispan transitive dependencies"
        }
    }
}
