plugins {
    id 'io.micronaut.build.internal.testcontainers-module'
    id 'io.micronaut.build.internal.kafka-testing'
}

description = """
Provides support for launching a Kafka test container.
"""

dependencies {
    implementation(libs.managed.testcontainers.kafka)
    implementation(mnKafka.kafka.clients)

    testImplementation(mnReactor.micronaut.reactor)
    testImplementation(mnKafka.micronaut.kafka)

    constraints {
        implementation(libs.lz4.java) {
            because "fixes GHSA-xx22-p4ch-683r in the Kafka client transitive dependencies"
        }
        implementation(libs.snappy.java) {
            because "fixes GHSA-gwq9-9ffj-mvrv, GHSA-q233-g92q-qxp6 and GHSA-xqrx-qh46-34m7 in the Kafka client transitive dependencies"
        }
    }
}
