plugins {
    id 'io.micronaut.build.internal.test-resources-module'
}

description = """
Provides support for launching a Redis test container.
"""

dependencies {
    api(project(':micronaut-test-resources-core'))
    api(project(':micronaut-test-resources-testcontainers'))
    api(libs.managed.testcontainers.redis)

    testImplementation(project(":micronaut-test-resources-embedded"))
    testImplementation(testFixtures(project(":micronaut-test-resources-testcontainers")))
    testImplementation(mnRedis.micronaut.redis.lettuce)

    constraints {
        implementation("com.fasterxml.jackson.core:jackson-core:2.22.2") {
            because "fixes Jackson security vulnerabilities in Redis transitive dependencies"
        }
        implementation("com.fasterxml.jackson.core:jackson-databind:2.22.2") {
            because "fixes Jackson security vulnerabilities in Redis transitive dependencies"
        }
        implementation(libs.httpclient5) {
            because "fixes GHSA-hjcp-jmpx-g3qm in the Redis testcontainers transitive dependencies"
        }
        implementation(libs.httpcore5) {
            because "fixes GHSA-hf6x-8p5f-cgmf in the Redis testcontainers transitive dependencies"
        }
        implementation(libs.httpcore5.h2) {
            because "fixes GHSA-v3jc-474w-2wm6 in the Redis testcontainers transitive dependencies"
        }
    }
}
