plugins {
    id 'io.micronaut.build.internal.test-resources-module'
}

description = """
Provides support for launching a Redis test container.
"""

dependencies {
    api(projects.micronautTestResourcesCore)
    api(projects.micronautTestResourcesTestcontainers)
    api(libs.managed.testcontainers.redis)
    compileOnly(projects.micronautTestResourcesCompose)

    testImplementation(projects.micronautTestResourcesEmbedded)
    testImplementation(testFixtures(projects.micronautTestResourcesTestcontainers))
    testImplementation(mnRedis.micronaut.redis.lettuce)

    constraints {
        implementation("com.fasterxml.jackson.core:jackson-core:2.21.5") {
            because "fixes Jackson security vulnerabilities in Redis transitive dependencies"
        }
        implementation("com.fasterxml.jackson.core:jackson-databind:2.21.5") {
            because "fixes Jackson security vulnerabilities in Redis transitive dependencies"
        }
        implementation("org.apache.httpcomponents.client5:httpclient5:5.6.3") {
            because "fixes GHSA-hjcp-jmpx-g3qm in Redis testcontainers transitive dependencies"
        }
        implementation("org.apache.httpcomponents.core5:httpcore5:5.4.3") {
            because "fixes GHSA-hf6x-8p5f-cgmf in Redis testcontainers transitive dependencies"
        }
        implementation("org.apache.httpcomponents.core5:httpcore5-h2:5.4.3") {
            because "fixes GHSA-v3jc-474w-2wm6 in Redis testcontainers transitive dependencies"
        }
    }
}
